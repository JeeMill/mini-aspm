name: Mini ASPM Security Gate

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  security:
    name: Security Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: false

      - name: Install Python dependencies and scanners
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install semgrep checkov

      - name: Install OSV-Scanner and Gitleaks
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          go install github.com/zricethezav/gitleaks/v8@latest

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify security tools
        run: |
          semgrep --version
          checkov --version
          osv-scanner --version
          gitleaks version
          docker --version

      - name: Prepare scan directory
        run: mkdir -p scans

      - name: Run security scanners
        run: python run_scans.py

      - name: Normalize findings
        run: python -m pipeline.normalize

      - name: Enforce security gate
        run: python -m pipeline.gate